[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "worktree-env"
version = "0.8.0"
description = "Per-worktree ports, secrets, and local environment setup for Git"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Shitong Chen" },
]
keywords = ["git", "worktree", "development", "ports", "environment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/archcst/worktree-env"
Repository = "https://github.com/archcst/worktree-env"
Issues = "https://github.com/archcst/worktree-env/issues"

[project.scripts]
wte = "worktree_env.cli:main"
worktree-env = "worktree_env.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worktree_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
